<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shorts · LOOT</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">
<style>
  .wrap{max-width:1160px;margin:0 auto;padding:var(--space-6) var(--space-5) var(--space-9)}
  .head{margin-bottom:var(--space-5)}
  .head h1{font-size:24px;line-height:32px}
  .head p{margin:6px 0 0;color:var(--fg-muted);font-size:var(--fs-md);max-width:640px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:var(--space-4)}
  .short{background:var(--surface);border-radius:10px;padding:var(--space-3);display:flex;flex-direction:column;gap:var(--space-3);box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow var(--dur-fast) var(--ease),opacity var(--dur-fast) var(--ease)}
  .short.kept{box-shadow:inset 0 0 0 2px var(--purple-soft)}
  .short.skipped{opacity:.5}
  .phone{position:relative;aspect-ratio:9/16;border-radius:8px;overflow:hidden;background:radial-gradient(120% 80% at 50% 0%,#3a2a55,#141118);cursor:pointer;border:0;padding:0;width:100%;display:block}
  .phone .shot{inset:24% 7% 40% 7%;border-radius:3px}
  .phone .cam{width:50%;right:25%;bottom:13%;box-shadow:0 0 0 2px #fff}
  .phone .hook{position:absolute;left:7%;right:24%;top:6%;font-weight:800;font-size:17px;line-height:1.12;color:#fff;text-align:left;text-shadow:0 2px 8px rgba(0,0,0,.6);z-index:2}
  .phone .sub{position:absolute;left:50%;transform:translateX(-50%);bottom:5%;background:#1A1A1A;color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:2px;white-space:nowrap;z-index:2}
  .phone .len{position:absolute;right:8px;top:8px;background:rgba(20,17,24,.85);font-size:var(--fs-xs);padding:2px 6px;border-radius:4px;z-index:3;font-variant-numeric:tabular-nums}
  .phone .po{position:absolute;inset:0;display:grid;place-items:center;background:rgba(20,17,24,.3);opacity:0;transition:opacity var(--dur-fast);z-index:4}
  .phone:hover .po{opacity:1}
  .phone .po span{width:48px;height:48px;border-radius:50%;background:rgba(246,246,244,.94);color:#1A1620;display:grid;place-items:center}
  .phone .po .ic{width:18px;height:18px;margin-left:2px}
  .short .input{font-weight:500}
  .why{font-size:var(--fs-xs);line-height:var(--lh-xs);color:var(--fg-muted);margin:0;min-height:32px}
  .acts{display:flex;gap:var(--space-1)}
  .acts .btn{flex:1;padding:0 6px;min-width:0}
  .keep[aria-pressed="true"]{background:var(--purple-strong);color:#fff}
  .trim{display:none;flex-direction:column;gap:6px}
  .short.trimming .trim{display:flex}
  .strip{position:relative;height:30px;background:var(--surface-2);border-radius:6px}
  .strip i{position:absolute;top:3px;bottom:3px;left:22%;width:46%;border-radius:4px;background:var(--purple-surface);box-shadow:inset 0 0 0 1px var(--purple-soft);border-left:5px solid var(--purple-soft);border-right:5px solid var(--purple-soft);cursor:ew-resize}
  .trim small{font-size:var(--fs-2xs);color:var(--fg-faint);display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
  @media (max-width:560px){.grid{grid-template-columns:1fr 1fr;gap:var(--space-3)}.wrap{padding:var(--space-4) var(--space-3) var(--space-8)}.phone .hook{font-size:13px}}
</style>
</head>
<body>
<header class="topbar">
  <a class="back" href="editor.html"><svg class="ic"><use href="assets/icons.svg#arrow-left"/></svg>Back to the video</a>
  <div class="right">
    <button class="btn primary" id="dl"><svg class="ic"><use href="assets/icons.svg#download"/></svg><span id="dlText">Download 1 short</span></button>
  </div>
</header>

<main class="wrap">
  <div class="head">
    <h1 class="page-title">Shorts from this video</h1>
    <p>LOOT found 4 parts that work on their own as a short. Keep the ones you like, then download them.</p>
  </div>
  <div class="grid" id="grid"></div>
</main>

<div class="toast" id="toast" hidden><span id="toastText"></span></div>

<script>
const ic=n=>`<svg class="ic"><use href="assets/icons.svg#${n}"/></svg>`;
const shorts=[
 {t:'Write one question first',hook:"Can't say it in one sentence?",sub:'the test is too big',len:'0:48',from:'0:14',to:'1:02',why:'Opens with a question and makes one clear point.',kept:true},
 {t:'The 80/20 budget split',hook:'I hold back twenty percent.',sub:"here's why",len:'0:55',from:'4:19',to:'5:14',why:'A simple rule people can copy right away.'},
 {t:'Cost per qualified lead',hook:"Clicks lie. This number doesn't.",sub:'cost per qualified lead',len:'0:41',from:'8:52',to:'9:33',why:'A strong opinion in the first three seconds.'},
 {t:'One channel, one audience',hook:'Test one thing at a time.',sub:'one channel, one audience',len:'0:34',from:'0:31',to:'1:05',why:'Short and complete, with no setup needed.'},
];
const grid=document.getElementById('grid');
function count(){const n=shorts.filter(s=>s.kept).length;document.getElementById('dlText').textContent=n?`Download ${n} ${n===1?'short':'shorts'}`:'Download shorts';document.getElementById('dl').disabled=!n;}
function render(){grid.innerHTML='';shorts.forEach((s,i)=>{const d=document.createElement('article');d.className='short'+(s.kept?' kept':'')+(s.skipped?' skipped':'')+(s.trim?' trimming':'');
  d.innerHTML=`<button class="phone" aria-label="Play ${s.t}"><span class="hook">${s.hook}</span><span class="len">${s.len}</span>
    <div class="shot"><div class="chrome"><i></i><i></i><i></i><b></b></div><div class="page"><div class="side"></div><div class="main"><div class="h"></div><div class="row"></div><div class="row"></div></div></div></div>
    <div class="cam"><img src="assets/avatar-256.png" alt=""></div><span class="sub">${s.sub}</span><span class="po"><span>${ic('play').replace('class="ic"','class="ic fill"')}</span></span></button>
   <input class="input" value="${s.t}" aria-label="Title">
   <p class="why">${s.why}</p>
   <div class="trim"><div class="strip"><i></i></div><small><span>Starts ${s.from}</span><span>Ends ${s.to}</span></small></div>
   <div class="acts"><button class="btn keep" data-keep="${i}" aria-pressed="${!!s.kept}">${s.kept?ic('check')+'Keeping':'Keep'}</button><button class="btn quiet" data-trim="${i}">${s.trim?'Done':'Trim'}</button><button class="btn quiet" data-skip="${i}">${s.skipped?'Undo':'Skip'}</button></div>`;
  grid.appendChild(d);});count();}
grid.addEventListener('click',e=>{const k=e.target.closest('[data-keep]'),s=e.target.closest('[data-skip]'),t=e.target.closest('[data-trim]');
  if(k){const x=shorts[+k.dataset.keep];x.kept=!x.kept;x.skipped=false;render();}
  if(s){const x=shorts[+s.dataset.skip];x.skipped=!x.skipped;if(x.skipped)x.kept=false;render();}
  if(t){const x=shorts[+t.dataset.trim];x.trim=!x.trim;render();}});
grid.addEventListener('change',e=>{const inp=e.target.closest('.input');if(!inp)return;const i=[...grid.children].indexOf(inp.closest('.short'));shorts[i].t=inp.value;});
document.getElementById('dl').onclick=()=>{const t=document.getElementById('toast');document.getElementById('toastText').textContent='Preparing your shorts. They will save to your Downloads folder.';t.hidden=false;setTimeout(()=>t.hidden=true,3000);};
render();
</script>
</body>
</html>
