# LOOT runs next to n8n and is reached only through Traefik (no ports are published).
services:
  loot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=America/Chicago
    labels:
      - traefik.enable=true
      - traefik.http.routers.loot.rule=Host(`loot.bichakhchyan.com`)
      - traefik.http.routers.loot.entrypoints=websecure
      - traefik.http.routers.loot.tls.certresolver=letsencrypt
      - traefik.http.services.loot.loadbalancer.server.port=8000
    volumes:
      - loot_data:/data
    # Leave room for n8n: LOOT may use at most 5 GB of memory and 1.75 of the 2 cores.
    mem_limit: 5g
    cpus: 1.75

volumes:
  loot_data:
