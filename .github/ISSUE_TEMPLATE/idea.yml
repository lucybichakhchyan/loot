name: Idea
description: Suggest something LOOT could do.
labels: ["idea"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe what you're trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How could LOOT help?
      description: Say how you picture it working. A sketch or a screenshot is welcome.
