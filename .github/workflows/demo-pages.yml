# Publishes the clickable demo (the approved mockups in design/) to GitHub Pages.
# It runs when the mockups change, or by hand from the Actions tab.
name: Clickable demo on GitHub Pages

on:
  push:
    branches: [main]
    paths: ["design/**", ".github/workflows/demo-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: design
      - id: deployment
        uses: actions/deploy-pages@v4
