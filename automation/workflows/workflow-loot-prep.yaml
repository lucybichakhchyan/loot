id: 62459387-0996-4253-b6d8-a3879b593cf6
name: loot-prep
description: Prepare one clip as soon as it uploads, so the editor opens quickly later; no Claude and no tokens
tags: {}
inputs:
  properties:
    project:
      type: string
      pattern: "^[a-z0-9]{12}$"
      description: LOOT project id
    clip:
      type: string
      pattern: "^[a-z0-9]{8}$"
      description: LOOT clip id
  required: ["project", "clip"]
jobs:
  - name: prep
    description: Runs in the background while the next clip is being recorded
    steps:
      - name: clip
        description: Encodes the clip at a steady 30 fps, levels and cleans its sound, and writes its transcript with Whisper
        task:
          type: behavior
          behavior: loot-prep
          methodName: execute
          inputs:
            project: ${{ inputs.project }}
            clip: ${{ inputs.clip }}
        dependsOn: []
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
version: 1
