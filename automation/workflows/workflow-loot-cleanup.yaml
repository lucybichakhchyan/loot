    description: Frees disk space and warns when the disk is over 80% full
    steps:
      - name: sweep
        description: Deletes exported projects' video files past the keep time and writes data/reports/cleanup.json
        task:
          type: behavior
          behavior: loot-cleanup
          methodName: execute
        dependsOn: []
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
