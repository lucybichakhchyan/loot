type: command/shell
typeVersion: 2026.02.09.1
id: a552b7f1-0d83-4e45-bc0a-acc62507c32d
name: loot-render
version: 1
tags: {}
inputs:
  properties:
    project:
      type: string
      pattern: "^[a-z0-9]{12}$"
      description: LOOT project id
  required: ["project"]
globalArguments: {}
methods:
  execute:
    arguments:
      run: 'python -m engine render ${{ inputs.project }}'
      workingDir: "/app"
      timeout: 7200000
